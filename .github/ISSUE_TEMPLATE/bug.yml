name: Bug report
description: Report a reproducible software problem
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: PHP, database and application versions
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Never include credentials, private links, payment or customer data.
